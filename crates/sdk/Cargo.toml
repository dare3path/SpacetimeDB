[package]
name = "spacetimedb-sdk"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "A Rust SDK for clients to interface with SpacetimeDB"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
spacetimedb-data-structures.workspace = true
spacetimedb-sats.workspace = true
spacetimedb-lib = { workspace = true, features = ["serde", "metrics_impls"]}
spacetimedb-client-api-messages.workspace = true
spacetimedb-metrics.workspace = true

thiserror.workspace = true
anymap.workspace = true
base64.workspace = true
brotli.workspace = true
bytes.workspace = true
futures.workspace = true
futures-channel.workspace = true
home.workspace = true
http.workspace = true
log.workspace = true
once_cell.workspace = true
prometheus.workspace = true
rand.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
#rustls = "0.23"
rustls.workspace = true
#rustls-pemfile = "2.2.0"
#native-tls = "0.2"  # Explicitly add for Connector::NativeTls
native-tls.workspace = true
#anyhow="1.0"
anyhow.workspace=true
clap.workspace=true
rustls-pemfile.workspace = true
#This pki-types crate is actually a dep of pemfile above, but we want a feature enabled, so:
rustls-pki-types.workspace=true #needed here, to enable its 'trace_drop_and_zeroize' feature
zeroize.workspace=true

[dev-dependencies]
# for quickstart-chat and cursive-chat examples
hex.workspace = true
# for cursive-chat example
cursive.workspace = true
futures-channel.workspace = true

# for tests
spacetimedb-testing = { path = "../testing" }

