[workspace]
members = [
  "crates/auth",
  "crates/bench",
  "crates/bindings-sys",
  "crates/bindings",
  "crates/bindings-macro",
  "crates/cli",
  "crates/client-api",
  "crates/client-api-messages",
  "crates/commitlog",
  "crates/core",
  "crates/data-structures",
  "crates/durability",
  "crates/execution",
  "crates/expr",
  "crates/fs-utils",
  "crates/lib",
  "crates/metrics",
  "crates/paths",
  "crates/physical-plan",
  "crates/primitives",
  "crates/query",
  "crates/sats",
  "crates/schema",
  "crates/sdk",
  "crates/snapshot",
  "crates/sqltest",
  "crates/sql-parser",
  "crates/standalone",
  "crates/subscription",
  "crates/table",
  "crates/testing",
  "crates/update",
  "crates/vm",
  "modules/benchmarks",
  "modules/keynote-benchmarks",
  "modules/perf-test",
  "modules/module-test",
  "modules/quickstart-chat",
  "modules/sdk-test",
  "modules/sdk-test-connect-disconnect",
  "crates/sdk/tests/test-client",
  "crates/sdk/tests/test-counter",
  "crates/sdk/tests/connect_disconnect_client",
  "tools/upgrade-version", "crates/codegen",
]
default-members = ["crates/cli", "crates/standalone", "crates/update"]
# cargo feature graph resolver. v3 is default in edition2024 but workspace
# manifests don't have editions.
resolver = "3"

[profile.release]
opt-level = 3
debug-assertions = false
overflow-checks = false
lto = "thin"
panic = 'unwind'
incremental = false
codegen-units = 16
rpath = false

[profile.release-fast]
inherits = "release"
lto = "thin"

[profile.dev]
opt-level = 0
debug = 1
#debug = true #FIXME: put this back
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.bench]
debug = true

[profile.test]
opt-level = 1
debug = true

[profile.profiling]
inherits = "release"
debug = true

[workspace.package]
version = "1.1.1"
edition = "2021"
# update rust-toolchain.toml too!
rust-version = "1.84.0"

